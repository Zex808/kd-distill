[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kd-distill"
version = "0.1.0"
description = "API/Ollama teacher → local GPU student via Hinton KD"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "gradio>=4.36.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "wandb>=0.17.0",
]

[project.scripts]
kd-harvest = "harvest:main"
kd-train   = "kd_trainer:main"
kd-eval    = "eval:main"
kd-app     = "app:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length handled separately
